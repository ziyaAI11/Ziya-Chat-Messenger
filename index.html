<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c3bdb">
  <title>ضیا | Ziya</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      color: #fff;
      background: linear-gradient(135deg, #17112d, #39216d, #6c3bdb);
    }

    .card {
      width: 100%;
      max-width: 390px;
      padding: 30px 24px;
      border: 1px solid #ffffff25;
      border-radius: 25px;
      background: #ffffff12;
      box-shadow: 0 20px 60px #0004;
      text-align: center;
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: #8c63ff;
      font-size: 38px;
      font-weight: bold;
    }

    h1 { margin: 8px 0; font-size: 30px; }
    .subtitle { color: #ddd3ff; line-height: 1.8; }

    input {
      width: 100%;
      padding: 15px;
      margin: 9px 0;
      border: 1px solid #ffffff35;
      border-radius: 13px;
      outline: none;
      background: #ffffff12;
      color: white;
      font-size: 16px;
      direction: ltr;
      text-align: left;
    }

    input::placeholder { color: #d6cbed; }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 13px;
      background: #9b7aff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }
    .secondary { background: #ffffff18; }

    #message {
      min-height: 45px;
      margin-top: 15px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .hidden { display: none !important; }
    .note { color: #d9d0f4; font-size: 12px; line-height: 1.8; }

    #recaptcha-container {
      display: flex;
      justify-content: center;
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">ض</div>
    <h1>ضیا | Ziya</h1>
    <p class="subtitle">ارتباط ساده، سریع و امن</p>

    <section id="phoneSection">
      <p>برای ورود، شماره آزمایشی ثبت‌شده در Firebase را وارد کن.</p>

      <input
        id="phone"
        type="tel"
        autocomplete="tel"
        placeholder="+989123456789"
        aria-label="شماره تلفن"
      >

      <div id="recaptcha-container"></div>

      <button id="sendBtn">ادامه</button>
    </section>

    <section id="codeSection" class="hidden">
      <p>کد تأیید شش‌رقمی را وارد کن.</p>

      <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="123456"
        aria-label="کد تأیید"
      >

      <button id="verifyBtn">تأیید و ورود</button>
      <button id="backBtn" class="secondary">بازگشت</button>
    </section>

    <section id="userSection" class="hidden">
      <h2>خوش آمدی! 💜</h2>
      <p id="userInfo"></p>
      <p class="note">
        ورود انجام شده است؛ قابلیت ارسال پیام هنوز ساخته نشده.
      </p>
      <button id="logoutBtn">خروج از حساب</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="note">
      نسخه آزمایشی ضیا؛ برای تست از شماره و کد آزمایشی تنظیم‌شده در Firebase استفاده کن.
    </p>
  </
