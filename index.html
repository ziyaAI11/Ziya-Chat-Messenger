<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ضیا | Ziya</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Tahoma,Arial;background:linear-gradient(135deg,#17112d,#6c3bdb);color:white}
.card{width:100%;max-width:390px;padding:28px 22px;border-radius:24px;background:#ffffff12;text-align:center}
.logo{font-size:38px;background:#8c63ff;border-radius:20px;width:70px;height:70px;margin:auto;display:grid;place-items:center}
input,button{width:100%;padding:14px;margin-top:12px;border-radius:12px;font-size:16px}
input{background:#ffffff12;color:white;border:1px solid #ffffff55;direction:ltr}
input::placeholder{color:#ddd}
button{border:0;background:#9b7aff;color:white;font-weight:bold}
.hidden{display:none!important}
#message{line-height:1.8;overflow-wrap:anywhere}
.note{font-size:12px;line-height:1.8;color:#ddd}
</style>
</head>
<body>
<main class="card">
<div class="logo">ض</div>
<h1>ضیا | Ziya</h1>
<p>ارتباط ساده، سریع و امن</p>

<section id="phoneSection">
<p>شماره آزمایشی ثبت‌شده در Firebase را وارد کن.</p>
<input id="phone" type="tel" placeholder="+989123456789">
<div id="recaptcha-container"></div>
<button id="sendBtn">ادامه</button>
</section>

<section id="codeSection" class="hidden">
<p>کد آزمایشی شش‌رقمی را وارد کن.</p>
<input id="code" inputmode="numeric" maxlength="6" placeholder="123456">
<button id="verifyBtn">تأیید و ورود</button>
<button id="backBtn">بازگشت</button>
</section>

<section id="userSection" class="hidden">
<h2>خوش آمدی! 💜</h2>
<p id="userInfo"></p>
<p class="note">این نسخه فقط ورود را آزمایش می‌کند؛ چت هنوز ساخته نشده است.</p>
<button id="logoutBtn">خروج از حساب</button>
</section>

<p id="message" role="status" aria-live="polite"></p>
<p class="note">نسخه آزمایشی ضیا</p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
 apiKey:"AIzaSyDZy11Zyu-CknUX2aa0yhC1cAu3O_GQ-Bg",
 authDomain:"ziya-8c980.firebaseapp.com",
 projectId:"ziya-8c980",
 storageBucket:"ziya-8c980.firebasestorage.app",
 messagingSenderId:"626266525556",
 appId:"1:626266525556:web:3472f9c09e5abe0849e621",
 measurementId:"G-90K8QD6KMS"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const $=id=>document.getElementById(id);
let verifier=null;
let confirmation=null;

function message(text,error=false){
 $("message").textContent=text;
 $("message").style.color=error?"#ffb6c1":"#c9ffda";
}
function section(id){
 ["phoneSection","codeSection","userSection"].forEach(x=>
  $(x).classList.toggle("hidden",x!==id)
 );
}
function errorText(e){
 const known={
 "auth/invalid-phone-number":"قالب شماره درست نیست.",
 "auth/invalid-verification-code":"کد اشتباه است.",
 "auth/too-many-requests":"تلاش‌های زیادی انجام شده؛ بعداً دوباره امتحان کن.",
 "auth/unauthorized-domain":"دامنه سایت در Firebase مجاز نشده.",
 "auth/operation-not-allowed":"ورود تلفنی در Firebase فعال نیست.",
 "auth/captcha-check-failed":"تأیید امنیتی ناموفق بود؛ صفحه را تازه کن.",
 "auth/network-request-failed":"اتصال اینترنت را بررسی کن."
 };
 return "کد: " + (e.code || "نامشخص") + " | " + (e.message || "");
}

$("sendBtn").onclick=async()=>{
 const phone=$("phone").value.trim();
 if(!phone){message("شماره تلفن را وارد کن.",true);return;}
 $("sendBtn").disabled=true;
 message("در حال آماده‌سازی...");
 try{
  if(!verifier){
   verifier=new firebase.auth.RecaptchaVerifier(
    "recaptcha-container",{size:"normal"}
   );
   await verifier.render();
  }
  confirmation=await auth.signInWithPhoneNumber(phone,verifier);
  section("codeSection");
  message("کد درخواست شد؛ کد آزمایشی ثبت‌شده در Firebase را وارد کن.");
 }catch(e){
  console.error(e);
  message(errorText(e),true);
  if(verifier){verifier.clear();verifier=null;}
  $("recaptcha-container").innerHTML="";
 }finally{
  $("sendBtn").disabled=false;
 }
};

$("verifyBtn").onclick=async()=>{
 const code=$("code").value.trim();
 if(!confirmation){message("اول شماره را وارد کن.",true);section("phoneSection");return;}
 if(!/^\d{6}$/.test(code)){message("کد باید شش رقم باشد.",true);return;}
 $("verifyBtn").disabled=true;
 try{
  await confirmation.confirm(code);
  message("ورود موفق بود!");
 }catch(e){
  console.error(e);
  message(errorText(e),true);
 }finally{
  $("verifyBtn").disabled=false;
 }
};

$("backBtn").onclick=()=>{
 confirmation=null;
 $("code").value="";
 section("phoneSection");
 message("");
};

$("logoutBtn").onclick=async()=>{
 try{await auth.signOut();message("از حساب خارج شدی.");}
 catch(e){message(errorText(e),true);}
};

auth.onAuthStateChanged(user=>{
 if(user){
  section("userSection");
  $("userInfo").textContent="حساب: "+(user.phoneNumber||"کاربر ضیا");
  confirmation=null;
 }else{
  section("phoneSection");
 }
});
</script>
</body>
</html>
