<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قلمرو افسانه‌ای ضیا</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  text-align:center;
  color:white;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(#090b2b,#30205c,#120e35);
}
.stars{
  position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;
}
.star{
  position:absolute;background:white;border-radius:50%;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
main{position:relative;z-index:1;padding:25px 14px 60px}
h1{
  color:#ffe9a8;
  text-shadow:0 0 15px #ffb7ff,0 0 30px #a58aff;
}
.subtitle{color:#e8d9ff;line-height:2}
.scene{
  height:270px;max-width:500px;margin:15px auto;
  position:relative;perspective:700px;
  touch-action:pan-y;
}
.island{
  position:absolute;width:240px;height:75px;
  bottom:28px;left:50%;transform:translateX(-50%);
  border-radius:50%;
  background:linear-gradient(#7ef5d1,#286f8b 55%,#18274d);
  box-shadow:0 0 35px #70eaff;
}
.island:after{
  content:"";position:absolute;left:18%;right:18%;top:50%;
  height:65px;background:#26315c;
  clip-path:polygon(0 0,100% 0,75% 100%,25% 100%);
}
.castle{
  position:absolute;bottom:78px;left:50%;
  transform:translateX(-50%);font-size:100px;
  filter:drop-shadow(0 0 18px #ffcbff);
  animation:castleGlow 3s infinite alternate;
}
@keyframes castleGlow{
  from{filter:drop-shadow(0 0 8px #b9a3ff)}
  to{filter:drop-shadow(0 0 25px #ffb9fa)}
}
.cloud{
  position:absolute;font-size:35px;opacity:.7;
  animation:cloudMove 9s infinite alternate ease-in-out;
}
.cloud.one{top:35px;left:8%}
.cloud.two{top:70px;right:8%;animation-delay:1s}
@keyframes cloudMove{to{transform:translateX(20px)}}
.panel{
  max-width:540px;margin:20px auto;padding:20px;
  border:1px solid #c7a8ff;border-radius:22px;
  background:#ffffff12;backdrop-filter:blur(8px);
  box-shadow:0 0 25px #9a70ff25;
}
button{
  border:0;border-radius:25px;padding:12px 18px;margin:7px;
  background:linear-gradient(135deg,#e9b8ff,#a6baff);
  color:#25143f;font-weight:bold;font-size:15px;
  cursor:pointer;box-shadow:0 0 12px #cda6ff50;
}
button:active{transform:scale(.96)}
.message{
  display:none;line-height:2.2;padding:15px;
  margin-top:12px;background:#ffffff12;border-radius:15px;
}
.envelope-area{margin:25px auto 10px}
.envelope{
  position:relative;width:220px;height:145px;
  margin:20px auto;cursor:pointer;
  background:#9b70d8;border-radius:5px;
  box-shadow:0 0 25px #c89cff70;
}
.envelope-front{
  position:absolute;bottom:0;left:0;right:0;height:90px;
  background:linear-gradient(135deg,#d7a8ff,#8c60c8);

  display:flex;align-items:end;justify-content:center;
  padding-bottom:15px;font-size:14px;font-weight:bold;
}
