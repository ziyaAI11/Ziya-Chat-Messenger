<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6c3bdb">
  <title>ضیا | Ziya</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Tahoma, Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #17112d, #39216d, #6c3bdb);
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 28px 22px;
      border: 1px solid #ffffff25;
      border-radius: 24px;
      background: #ffffff12;
      box-shadow: 0 20px 60px #0004;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: auto;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #8c63ff;
      font-size: 38px;
      font-weight: bold;
    }

    h1 { margin: 12px 0; }

    p { line-height: 1.8; }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 12px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ffffff45;
      outline: none;
      background: #ffffff12;
      color: white;
      direction: ltr;
      text-align: left;
    }

    input::placeholder { color: #ddd2f5; }

    button {
      border: 0;
      background: #9b7aff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .secondary { background: #ffffff20; }

    .hidden { display: none !important; }

    #message {
      min-height: 45px;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .note {
      color: #ddd2f5;
      font-size: 12px;
    }

    #recaptcha-container {
      display: flex;
      justify-content: center;
      margin-top: 12px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo">ض</div>
    <h1>ضیا | Ziya</h1>
    <p>ارتباط ساده، سریع و امن 💜</p>

    <section id="phoneSection">
      <p>شماره آزمایشی ثبت‌شده در Firebase را وارد کن.</p>

      <input
        id="phone"
        type="tel"
        autocomplete="tel"
        placeholder="+989123456789"
        aria-label="شماره تلفن"
      >

      <div id="recaptcha-container"></div>

      <button id="sendBtn">ادامه</button>
    </section>

    <section id="codeSection" class="hidden">
      <p>کد شش‌رقمی تنظیم‌شده در Firebase را وارد کن.</p>

      <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="123456"
        aria-label="کد تأیید"
      >

      <button id="verifyBtn">تأیید و ورود</button>
      <button id="backBtn" class="secondary">بازگشت</button>
    </section>

    <section id="userSection" class="hidden">
      <h2>خوش آمدی! 🎉</h2>
      <p id="userInfo"></p>
      <p class="note">
        ورود موفق است؛ قابلیت چت هنوز ساخته نشده.
      </p>
      <button id="logoutBtn">خروج از حساب</button>
    </section>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="note">
      نسخه آزمایشی ضیا — از کد تأیید فقط در سایت خودت استفاده کن.
    </p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDZy11Zyu-CknUX2aa0yhC1cAu3O_GQ-Bg",
      authDomain: "ziya-8c980.firebaseapp.com",
      projectId: "ziya-8c980",
      storageBucket: "ziya-8c980.firebasestorage.app",
      messagingSenderId: "626266525556",
      appId: "1:626266525556:web:3472f9c09e5abe0849e621",
      measurementId: "G-90K8QD6KMS"
    };

    const $ = id => document.getElementById(id);

    let auth = null;
    let verifier = null;
    let confirmation = null;

    function showMessage(text, error = false) {
      $("message").textContent = text;
      $("message").style.color = error ? "#ffb6c1" : "#c9ffda";
    }

    function showSection(sectionId) {
      ["phoneSection", "codeSection", "userSection"].forEach(id => {
        $(id).classList.toggle("hidden", id !== sectionId);
      });
    }

    function showFirebaseError(error) {
      console.error("Firebase error:", error);

      const code = error && error.code
        ? error.code
        : "unknown";

      const details = error && error.message
        ? error.message
        : "پیام خطا موجود نیست.";

      // نمایش کد واقعی برای عیب‌یابی
      showMessage("کد خطا: " + code + " | پیام: " + details, true);
    }

    function resetRecaptcha() {
      if (verifier) {
        try {
          verifier.clear();
        } catch (error) {
          console.warn("reCAPTCHA cleanup:", error);
        }
      }

      verifier = null;
      $("recaptcha-container").innerHTML = "";
    }

    // بررسی بارگذاری Firebase
    try {
      if (!window.firebase) {
        throw new Error("کتابخانه Firebase بارگذاری نشده است.");
      }

      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();

      auth.onAuthStateChanged(user => {
        if (user) {
          showSection("userSection");

          $("userInfo").textContent =
            "حساب واردشده: " + (user.phoneNumber || "کاربر ضیا");

          confirmation = null;
        } else {
          showSection("phoneSection");
        }
      });

    } catch (error) {
      showFirebaseError(error);
    }

    // درخواست ورود
    $("sendBtn").addEventListener("click", async () => {
      if (!auth) {
        showMessage(
          "Firebase آماده نیست. اتصال اینترنت و بارگذاری کتابخانه را بررسی کن.",
          true
        );
        return;
      }

      const phone = $("phone").value.trim();

      if (!phone) {
        showMessage("شماره تلفن را وارد کن.", true);
        return;
      }

      $("sendBtn").disabled = true;
      showMessage("در حال آماده‌سازی ورود...");

      try {
        if (!verifier) {
          verifier = new firebase.auth.RecaptchaVerifier(
            "recaptcha-container",
            { size: "normal" }
          );

          await verifier.render();
        }

        confirmation = await auth.signInWithPhoneNumber(
          phone,
          verifier
        );

        showSection("codeSection");

        showMessage(
          "درخواست موفق بود. کد آزمایشی ثبت‌شده در Firebase را وارد کن."
        );

        $("code").focus();

      } catch (error) {
        showFirebaseError(error);
        resetRecaptcha();

      } finally {
        $("sendBtn").disabled = false;
      }
    });

    // تأیید کد
    $("verifyBtn").addEventListener("click", async () => {
      if (!confirmation) {
        showMessage("ابتدا شماره تلفن را وارد کن.", true);
        showSection("phoneSection");
        return;
      }

      const code = $("code").value.trim();

      if (!/^\d{6}$/.test(code)) {
        showMessage("کد باید دقیقاً شش رقم باشد.", true);
        return;
      }

      $("verifyBtn").disabled = true;
      showMessage("در حال بررسی کد...");

      try {
        await confirmation.confirm(code);
        showMessage("ورود موفق بود! 💜");

      } catch (error) {
        showFirebaseError(error);

      } finally {
        $("verifyBtn").disabled = false;
      }
    });

    // بازگشت به صفحه شماره
    $("backBtn").addEventListener("click", () => {
      confirmation = null;
      $("code").value = "";
      showSection("phone
