<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b24">
<title>دنیای جادویی ضیا ✨</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;
 font-family:Tahoma,Arial,sans-serif;text-align:center;
 background:radial-gradient(ellipse at top,#263c80,#10132f 55%,#050615);
 overflow-x:hidden
}
#stars{position:fixed;inset:0;pointer-events:none}
.star{
 position:absolute;background:white;border-radius:50%;
 animation:twinkle 2s infinite alternate
}
@keyframes twinkle{from{opacity:.2}to{opacity:1}}
.moon{
 position:fixed;top:35px;left:25px;width:55px;height:55px;
 background:#fff1bf;border-radius:50%;
 box-shadow:0 0 30px #ffe8a5;pointer-events:none
}
main{position:relative;max-width:650px;margin:auto;padding:30px 18px}
h1{font-size:clamp(30px,8vw,46px);color:#ffd7ef;
 text-shadow:0 0 22px #ff78ca;margin:18px 0}
.intro{line-height:2;color:#dce3ff;font-size:15px}
.scene{height:260px;position:relative;margin:25px auto 10px}
.island{
 position:absolute;bottom:25px;left:50%;transform:translateX(-50%);
 width:250px;height:75px;border-radius:50%;
 background:linear-gradient(#698bd5,#26376d 65%,#131c48);
 box-shadow:0 15px 30px #0008,0 0 35px #75aaff66
}
.castle{
 position:absolute;bottom:85px;left:50%;transform:translateX(-50%);
 width:170px;height:120px;
 filter:drop-shadow(0 0 14px #ffb6d5)
}
.tower{
 position:absolute;bottom:0;width:40px;
 background:linear-gradient(90deg,#66558e,#d6a3ca,#66558e);
 border:1px solid #ffe0ef
}
.tower:before{
 content:"";position:absolute;top:-25px;left:-6px;
 border-left:26px solid transparent;border-right:26px solid transparent;
 border-bottom:28px solid #ffb5d5
}
.a{height:65px;left:0}
.b{height:100px;left:65px;width:42px}
.c{height:70px;right:0}
.window{
 position:absolute;bottom:18px;left:14px;width:9px;height:15px;
 border-radius:8px;background:#ffe9a2;box-shadow:0 0 12px #ffe9a2
}
.b .window{height:22px;bottom:30px;left:16px}
.cloud{
 position:absolute;font-size:24px;
 animation:float 4s ease-in-out infinite
}
.c1{left:10%;top:45px}.c2{right:9%;top:100px;animation-delay:-2s}
.c3{left:24%;top:130px;animation-delay:-1s}
@keyframes float{50%{transform:translateY(-13px)}}
.card{
 margin:18px 0;padding:22px 17px;border-radius:22px;
 background:#ffffff0d;border:1px solid #b9c7ff40;
 box-shadow:0 10px 35px #0003
}
h2{font-size:20px;color:#ffd5ed}
p{line-height:2}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{
 padding:14px 8px;border:1px solid #ffffff40;border-radius:15px;
 background:linear-gradient(135deg,#7652a6,#394f9b);
 color:white;font:inherit;cursor:pointer
}
button:active{transform:scale(.97)}
button span{display:block;font-size:25px;margin-bottom:6px}
#message{
 display:none;margin-top:18px;padding:17px;border-radius:15px;
 background:#ff8bc91a;border:1px solid #ff8bc966;line-height:2;
 animation:appear .4s
}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.heart{
 position:fixed;bottom:10px;pointer-events:none;
 animation:rise 2.5s forwards;z-index:5
}
@keyframes rise{to{transform:translateY(-85vh) rotate(25deg);opacity:0}}
footer{font-size:12px;color:#b9c5ed;padding:22px}
</style>
</head>

<body>
<div id="stars"></div>
<div class="moon"></div>

<main>
 <div style="color:#c5d1ff;font-size:13px">
  ✦ یک گوشهٔ کوچک از خیال ✦
 </div>

 <h1>دنیای جادویی ضیا 🌙</h1>

 <div class="intro">
  به دنیای کوچولوی ما خوش اومدی ✨<br>
  اینجا ستاره‌ها برای تو روشن می‌شن.
 </div>

 <section class="scene">
  <div class="cloud c1">✨</div>
  <div class="cloud c2">🏮</div>
  <div class="cloud c3">💫</div>

  <div class="castle">
   <div class="tower a"><i class="window"></i></div>
   <div class="tower b"><i class="window"></i></div>
   <div class="tower c"><i class="window"></i></div>
  </div>

  <div class="island"></div>
 </section>

 <section class="card">
  <h2>💜 برای تو ساخته شده</h2>
  <p>
   این دنیا شاید کوچک باشه، اما یک سورپرایز قشنگ
   توی دلش پنهان شده. هر دکمه رو لمس کن و کشفش کن.
  </p>

  <div class="buttons">
   <button onclick="letter()">
    <span>💌</span>نامهٔ مخصوص تو
   </button>

   <button onclick="wish()">
    <span>🌠</span>یک آرزو کن
   </button>

   <button onclick="secret()">
    <span>🎁</span>سورپرایز مخفی
   </button>

   <button onclick="magic()">
    <span>💖</span>روشن کردن جادو
   </button>
  </div>

  <div id="message" aria-live="polite"></div>
 </section>

 <footer>
  با خیال ساخته شده، برای ساختن یک لبخند ♡<br>
  دنیای جادویی ضیا ✨
 </footer>
</main>

<script>
const sky=document.getElementById("stars");

for(let i=0;i<100;i++){
 const s=document.createElement("i");
 s.className="star";
 s.style.left=Math.random()*100+"%";
 s.style.top=Math.random()*100+"%";
 const size=1+Math.random()*3;
 s.style.width=size+"px";
 s.style.height=size+"px";
 s.style.animationDelay=Math.random()*3+"s";
 sky.appendChild(s);
}

function show(text){
 const box=document.getElementById("message");
 box.textContent=text;
 box.style.display="block";
 box.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function letter(){
 show("یک نامه برای تو 💌 امیدوارم هر روزت پر از لحظه‌های قشنگ باشه. این صفحه رو با فکر ساختن یک لبخند طراحی کردم؛ چون گاهی یک کار کوچک می‌تونه خاطره‌ای بزرگ بسازه. ♡");
}

function wish(){
 show("چشم‌هات رو ببند و یک آرزوی قشنگ کن 🌠 شاید جادوی واقعی از همین امیدهای کوچیک شروع بشه.");
}

function secret(){
 show("🎁 سورپرایز مخفی: تو الان وارد دنیایی شدی که ضیا با خیال و سلیقهٔ خودش ساخته تا لحظه‌ای متفاوت برات بسازه. این فقط شروع ماجراست! ✨");
}

function magic(){
 for(let i=0;i<24;i++){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["💖","💕","✨","🌟"][Math.floor(Math.random()*4)];
  h.style.left=Math.random()*95+"%";
  h.style.fontSize=(18+Math.random()*20)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),2700);
 }
 show("جادو روشن شد! 💖 امیدوارم این لحظه لبخند به لبت بیاره.");
}
</script>
</body>
</html>
