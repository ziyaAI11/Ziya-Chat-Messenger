<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ضیا | Ziya</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f0ff;
      color: #222;
    }
    header {
      background: #6842d9;
      color: white;
      padding: 22px;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }
    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 16px #00000012;
    }
    h2 { margin-top: 0; }
    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 12px;
      background: #6842d9;
      color: white;
      font-size: 17px;
    }
    .note {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <header>💬 ضیا | Ziya</header>

  <div class="container">
    <div class="card">
      <h2>به ضیا خوش آمدی ❤️</h2>
      <p>پیام‌رسانی با طراحی اختصاصی خودمان!</p>

      <input type="text" placeholder="نام کاربری">
      <input type="password" placeholder="رمز عبور">

      <button onclick="alert('بخش ثبت‌نام را در مرحله بعد می‌سازیم!')">
        ورود / ثبت‌نام
      </button>

      <p class="note">
        نسخه آزمایشی ضیا — در حال ساخت 🚀
      </p>
    </div>
  </div>
</body>
</html>
